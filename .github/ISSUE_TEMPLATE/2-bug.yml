name: Bug or install problem
description: The server fails to install, start, connect or answer.
title: "Bug: "
body:
  - type: input
    id: version
    attributes:
      label: Output of quantavane-mcp --version (if it starts)
  - type: input
    id: system
    attributes:
      label: Operating system, Python version and MCP client
      placeholder: macOS 15, Python 3.12, Claude Code
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: The command or tool call, and what it printed
      render: text
    validations:
      required: true
  - type: textarea
    id: selftest
    attributes:
      label: Output of quantavane-mcp selftest
      render: text
